<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Layout 3</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Marcação e Layout Web</h1>
    </header>

    <div class="layout-container">
      <aside class="left">
        <h2>Exercícios</h2>
        <ul>
          <li><a href="form1.html">Formulários</a></li>
        </ul>
      </aside>

      <main>
        <h2>Formulário</h2>
        <form action="form.php" method="post" class="p-3">
          <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" id="name" class="form-control" />
          </div>

          <div class="mb-3">
            <label for="date" class="form-label">Data de Nascimento</label>
            <input type="date" id="date" class="form-control" />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" />
          </div>

          <div class="mb-3">
            <label for="cellphone" class="form-label">Celular</label>
            <input type="tel" id="cellphone" class="form-control" />
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Mensagem</label>
            <textarea id="message" rows="6" class="form-control"></textarea>
          </div>

          <div class="d-flex gap-2">
            <input type="reset" value="Limpar" class="btn btn-secondary" />
            <input type="submit" value="Enviar" class="btn btn-primary" />
          </div>
        </form>
      </main>

      <aside class="right">
        <h2>Formulários</h2>
        <ul>
          <li><a href="form1.html">Formulário</a></li>
          <li><a href="form2.html">Formulário Responsivo</a></li>
          <li><a href="form3.html">Formulário Bootstrap</a></li>
        </ul>
      </aside>
    </div>

    <footer>
      <p>Autor: <span title="Clarisse >:3">Guilherme Rosseti</span></p>
      <a href="index.html">Inicio</a>
    </footer>
  </body>
</html>
